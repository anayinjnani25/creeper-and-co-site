<style>

  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; background: radial-gradient(60% 60% at 80% 10%, rgba(217,130,78,.16), transparent 70%), var(--night); color: var(--cream); font: 16px/1.6 "Familjen Grotesk", system-ui, sans-serif; text-align: center; }

  h1 { font: 400 clamp(88px, 22vw, 180px)/.9 Gloock, Georgia, serif; letter-spacing: -.04em; }
  h1 em { font-family: Fraunces, Georgia, serif; font-style: italic; color: var(--copper); }

  p { color: var(--muted); max-width: 42ch; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  a.pill { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px; background: var(--cream); color: var(--night); font-weight: 600; text-decoration: none; transition: background .25s, transform .25s; }
  a.pill:hover { background: var(--copper); transform: translateY(-2px); }
  a.pill.ghost { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1px rgba(235,225,213,.3); }
  a.pill.ghost:hover { box-shadow: inset 0 0 0 1px var(--copper); color: var(--copper); background: transparent; }
  a:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
